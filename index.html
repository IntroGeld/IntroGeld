<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contributie & Intropas</title>
<style>
:root{
  --bg:#f7f2f2; --card:#ffffff; --text:#241416; --muted:#7a6265;
  --border:#e8d9da; --accent:#a3122b; --accent2:#0d7a72; --danger:#a3122b;
  --pill:#f1e4e5;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#180f10; --card:#241618; --text:#f5e9ea; --muted:#b89ba0;
    --border:#3d2529; --accent:#e0405e; --accent2:#2bc4b6; --danger:#e0405e;
    --pill:#2e1c1f;
  }
}
:root[data-theme="dark"]{
  --bg:#180f10; --card:#241618; --text:#f5e9ea; --muted:#b89ba0;
  --border:#3d2529; --accent:#e0405e; --accent2:#2bc4b6; --danger:#e0405e;
  --pill:#2e1c1f;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
h1{font-size:1.3rem;margin:4px 0 14px}
.tabs{display:flex;gap:8px;margin-bottom:16px;border-bottom:1px solid var(--border)}
.tab{padding:10px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;font-weight:600;font-size:.92rem}
.tab.active{color:var(--accent);border-color:var(--accent)}
.view{display:none}
.view.active{display:block}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:10px;position:relative}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.name{font-weight:700}
.sub{color:var(--muted);font-size:.85rem;margin-top:2px}
.owed{color:var(--danger)}
.paid{color:var(--accent2)}
.lid{display:flex;align-items:center;gap:8px;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:90}
.modal-box{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;max-width:380px;width:100%;max-height:80vh;overflow-y:auto}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.modal-sub{color:var(--muted);font-size:.85rem;margin-bottom:14px}
.month-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:.9rem}
.month-row:last-child{border-bottom:none}
.pw-box input{width:100%;margin-bottom:10px;text-align:center}
.pw-box button.primary{width:100%;margin-bottom:8px}
.del-x{background:none;border:none;color:var(--muted);font-size:1rem;cursor:pointer;width:22px;flex-shrink:0}
.lid-name{flex:1;text-align:center;font-weight:700}
.lid-ctrl{flex-shrink:0;min-width:96px;display:flex;justify-content:flex-end}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:28px;height:28px;border-radius:8px;border:1px solid var(--border);background:var(--pill);color:var(--text);font-size:1rem;cursor:pointer}
.pill{background:var(--pill);border-radius:8px;padding:3px 10px;font-weight:700;min-width:26px;text-align:center;font-size:.85rem}
.readonly-amt{text-align:right}
.readonly-amt .pill{display:block;margin-left:auto}
.readonly-amt .sub{text-align:right}
.anys-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.beer-stack{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.beer-stack svg{width:34px;height:34px;flex-shrink:0}
form.add{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
input,select{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:9px 10px;font-size:.9rem}
input[type=text]{flex:1;min-width:120px}
input[type=number]{width:100px}
button.primary{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:9px 16px;font-weight:700;cursor:pointer}
button.link{background:none;border:none;color:var(--muted);cursor:pointer;font-size:.85rem;text-decoration:underline}
.summary{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.stat{flex:1;min-width:110px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px}
.stat .label{color:var(--muted);font-size:.76rem}
.stat .val{font-size:1.15rem;font-weight:800;margin-top:2px}
.period-bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.empty{color:var(--muted);text-align:center;padding:30px 0}
.badge{font-size:.75rem;padding:2px 8px;border-radius:999px;font-weight:700}
.badge.inkomst{background:#0d7a7222;color:var(--accent2)}
.badge.uitgave{background:#a3122b22;color:var(--danger)}
.gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100}
.gate-box{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px;max-width:320px;width:100%;text-align:center}
.gate-box h2{margin:0 0 6px;font-size:1.1rem}
.gate-box p{color:var(--muted);font-size:.85rem;margin:0 0 14px}
.gate-box input{width:100%;margin-bottom:10px;text-align:center}
.gate-box button{width:100%}
.gate-err{color:var(--danger);font-size:.8rem;min-height:1.2em;margin-top:6px}
</style>
</head>
<body>
<div class="gate" id="site-gate">
  <div class="gate-box">
    <h2>Toegang vereist</h2>
    <p>Vul het wachtwoord in om de site te openen.</p>
    <form id="gate-form">
      <input type="password" id="gate-input" placeholder="Wachtwoord" autofocus>
      <button class="primary" type="submit">Ontgrendelen</button>
      <div class="gate-err" id="gate-err"></div>
    </form>
  </div>
</div>
<div id="app" style="display:none">
<div class="row" style="margin-bottom:14px">
  <h1 style="margin:0">Contributie & Intropas</h1>
  <div><button class="link" id="share-btn">🔗 Delen</button> <button class="link" id="admin-toggle">🔒 Beheerder inloggen</button></div>
</div>
<div id="share-info" class="sub" style="display:none;margin-bottom:10px;word-break:break-all"></div>
<div class="tabs">
  <div class="tab active" data-tab="leden">Leden</div>
  <div class="tab" data-tab="anys">Anys</div>
  <div class="tab" data-tab="intropas">Intropas</div>
</div>

<div class="view active" id="view-leden">
  <div class="period-bar">
    <select id="period-mode">
      <option value="maand">Maand</option>
      <option value="tm">T/m maand</option>
      <option value="totaal">Totaal</option>
    </select>
    <select id="period-month"></select>
  </div>
  <div class="summary">
    <div class="stat"><div class="label">Betaald</div><div class="val" id="stat-paid-count">0 / 0</div></div>
    <div class="stat"><div class="label">Opgehaald</div><div class="val" id="stat-paid-total">€0,00</div></div>
    <div class="stat"><div class="label">Nog te betalen</div><div class="val" id="stat-open-total">€0,00</div></div>
  </div>
  <form class="add" id="form-lid">
    <input type="text" id="lid-naam" placeholder="Naam" required>
    <button class="primary" type="submit">Lid toevoegen</button>
  </form>
  <div id="leden-list"></div>
</div>

<div class="modal" id="member-modal" style="display:none">
  <div class="modal-box">
    <div class="modal-head">
      <div class="name" id="modal-name">–</div>
      <button class="link" id="modal-close">Sluiten</button>
    </div>
    <div class="modal-sub" id="modal-sub"></div>
    <div id="modal-months"></div>
  </div>
</div>

<div class="modal" id="admin-modal" style="display:none">
  <div class="modal-box pw-box">
    <h2 style="margin:0 0 6px;font-size:1.1rem">Beheerderswachtwoord</h2>
    <p style="color:var(--muted);font-size:.85rem;margin:0 0 14px">Vul het wachtwoord in om te kunnen bewerken.</p>
    <form id="admin-form">
      <input type="password" id="admin-input" placeholder="Wachtwoord" autofocus>
      <button class="primary" type="submit">Inloggen</button>
      <button class="link" type="button" id="admin-cancel">Annuleren</button>
      <div class="gate-err" id="admin-err"></div>
    </form>
  </div>
</div>

<div class="view" id="view-anys">
  <div id="anys-list"></div>
</div>

<div class="view" id="view-intropas">
  <div class="summary">
    <div class="stat"><div class="label">Inkomsten</div><div class="val" id="stat-in">€0,00</div></div>
    <div class="stat"><div class="label">Uitgaven</div><div class="val" id="stat-out">€0,00</div></div>
    <div class="stat"><div class="label">Resterend budget</div><div class="val" id="stat-rest">€0,00</div></div>
  </div>
  <form class="add" id="form-tx">
    <input type="text" id="tx-desc" placeholder="Omschrijving" required>
    <select id="tx-type"><option value="inkomst">Inkomst</option><option value="uitgave">Uitgave</option></select>
    <input type="number" id="tx-amount" placeholder="Bedrag €" step="0.01" min="0" required>
    <input type="date" id="tx-date" required>
    <button class="primary" type="submit">Boeken</
